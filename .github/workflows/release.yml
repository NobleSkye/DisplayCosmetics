name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Release Please
        uses: google-github-actions/release-please-action@v4
        with:
          release-type: maven
          package-name: display-cosmetics
          default-branch: main

  build-and-upload:
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build shaded jar
        run: mvn -B -DskipTests package

      - name: Locate artifact
        id: artifact
        run: |
          ARTIFACT_ID=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.artifactId)
          VERSION=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          JAR="target/${ARTIFACT_ID}-${VERSION}.jar"
          if [ ! -f "$JAR" ]; then
            echo "Jar not found: $JAR" >&2
            exit 1
          fi
          echo "jar_path=$JAR" >> "$GITHUB_OUTPUT"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.artifact.outputs.jar_path }}
